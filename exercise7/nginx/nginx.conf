events {}
http {
  client_max_body_size 50M;
  # federation endpoint (TLS, port 8448) for both homeservers
  server {
    listen 8448 ssl;
    server_name cr261517.matrix.test;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / {
      proxy_pass http://hsA:8008;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
    }
  }
  server {
    listen 8448 ssl;
    server_name partner.matrix.test;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / {
      proxy_pass http://hsB:8008;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
    }
  }
}
